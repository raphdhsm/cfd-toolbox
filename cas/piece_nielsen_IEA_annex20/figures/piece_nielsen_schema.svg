<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Pièce ventilée de Nielsen (IEA Annex 20), cas 2D</text>

  <!-- Intérieur de la pièce -->
  <rect x="110" y="70" width="720" height="240" fill="#f4f8fc"/>

  <!-- Murs (traits épais), avec ouvertures -->
  <!-- plafond -->
  <line x1="110" y1="70" x2="830" y2="70" stroke="#222" stroke-width="4"/>
  <!-- sol -->
  <line x1="110" y1="310" x2="830" y2="310" stroke="#222" stroke-width="4"/>
  <!-- mur gauche : ouvert entre y=70 et y=83.4 (entrée) -->
  <line x1="110" y1="83.4" x2="110" y2="310" stroke="#222" stroke-width="4"/>
  <!-- mur droit : ouvert entre y=271.6 et y=310 (sortie) -->
  <line x1="830" y1="70" x2="830" y2="271.6" stroke="#222" stroke-width="4"/>

  <!-- Entrée -->
  <line x1="110" y1="70" x2="110" y2="83.4" stroke="#1f6fb2" stroke-width="4"/>
  <line x1="50" y1="76.7" x2="106" y2="76.7" stroke="#1f6fb2" stroke-width="3" marker-end="url(#arr)"/>
  <text x="20" y="62" font-size="13" fill="#1f6fb2" font-weight="bold">Entrée</text>
  <text x="20" y="100" font-size="12" fill="#1f6fb2">U₀ ≈ 0,455 m/s</text>

  <!-- Sortie -->
  <line x1="830" y1="271.6" x2="830" y2="310" stroke="#c0392b" stroke-width="4"/>
  <line x1="834" y1="290.8" x2="895" y2="290.8" stroke="#c0392b" stroke-width="3" marker-end="url(#arrRed)"/>
  <text x="852" y="276" font-size="13" fill="#c0392b" font-weight="bold">Sortie</text>

  <!-- Écoulement qualitatif : jet au plafond + recirculation -->
  <path d="M130,80 C400,82 700,84 790,110 C820,135 815,230 760,262 C600,300 300,300 170,270 C120,250 140,165 240,150"
        fill="none" stroke="#1f6fb2" stroke-width="1.6" stroke-dasharray="2 5" opacity="0.75" marker-end="url(#arr)"/>
  <text x="470" y="200" text-anchor="middle" font-size="13" fill="#1f6fb2" font-style="italic">grande recirculation</text>
  <text x="470" y="100" text-anchor="middle" font-size="12" fill="#1f6fb2" font-style="italic">jet collé au plafond (effet Coanda)</text>

  <!-- Lignes de mesure (pointillés gris) -->
  <line x1="350" y1="70" x2="350" y2="310" stroke="#7a7a7a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="590" y1="70" x2="590" y2="310" stroke="#7a7a7a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="110" y1="76.7" x2="830" y2="76.7" stroke="#7a7a7a" stroke-width="1.2" stroke-dasharray="6 4"/>
  <line x1="110" y1="303.3" x2="830" y2="303.3" stroke="#7a7a7a" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="350" y="62" text-anchor="middle" font-size="12" fill="#555">x = H</text>
  <text x="590" y="62" text-anchor="middle" font-size="12" fill="#555">x = 2H</text>
  <text x="845" y="318" font-size="11" fill="#555">y = h/2</text>
  <text x="845" y="80" font-size="11" fill="#555">y = H − h/2</text>

  <!-- Cotes -->
  <!-- L -->
  <line x1="110" y1="345" x2="830" y2="345" stroke="#444" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <line x1="110" y1="315" x2="110" y2="352" stroke="#999" stroke-width="0.8"/>
  <line x1="830" y1="315" x2="830" y2="352" stroke="#999" stroke-width="0.8"/>
  <text x="470" y="340" text-anchor="middle" font-size="14" fill="#222">L = 9,0 m</text>
  <!-- H -->
  <line x1="80" y1="120" x2="80" y2="310" stroke="#444" stroke-width="1" marker-end="url(#dim)"/>
  <line x1="80" y1="120" x2="80" y2="70" stroke="#444" stroke-width="1" marker-end="url(#dim)"/>
  <rect x="60" y="180" width="40" height="22" fill="#fff"/>
  <text x="80" y="196" text-anchor="middle" font-size="14" fill="#222">H = 3 m</text>
  <!-- h -->
  <text x="118" y="130" font-size="12" fill="#1f6fb2">h = 0,168 m</text>
  <line x1="122" y1="118" x2="113" y2="86" stroke="#1f6fb2" stroke-width="0.8"/>
  <!-- t -->
  <line x1="910" y1="271.6" x2="910" y2="310" stroke="#444" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text x="918" y="295" font-size="12" fill="#222">t = 0,48 m</text>

  <!-- Légende -->
  <g font-size="12" fill="#333">
    <line x1="110" y1="385" x2="140" y2="385" stroke="#222" stroke-width="4"/>
    <text x="148" y="389">Murs (paroi, U = 0)</text>
    <line x1="300" y1="385" x2="330" y2="385" stroke="#7a7a7a" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="338" y="389">Lignes de mesure expérimentales</text>
    <line x1="560" y1="385" x2="590" y2="385" stroke="#1f6fb2" stroke-width="1.6" stroke-dasharray="2 5"/>
    <text x="598" y="389">Allure de l'écoulement (qualitatif)</text>
  </g>
  <text x="110" y="420" font-size="12" fill="#555">Re = U₀·h/ν ≈ 5 000 (turbulent). Ratios : L/H = 3, h/H = 0,056, t/H = 0,16. Pièce dessinée à l'échelle.</text>
  <text x="110" y="440" font-size="12" fill="#555">Cas 2D dans OpenFOAM : une seule maille d'épaisseur, faces avant et arrière de type « empty ».</text>
</svg>
